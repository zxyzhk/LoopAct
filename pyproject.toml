[build-system]
requires = ["setuptools>=64.0.0", "wheel", "pip>=21.3", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "loopact"
version = "0.1.0"
description = "Closed-Loop Action Refinement for Vision-Language-Action Policies"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
  # =========================================================
  # GR00T CORE (shared by both libero + robo)
  # =========================================================
  "albumentations==1.4.18",
  "av==12.3.0",
  "blessings==1.7",
  "eva-decord==0.6.1; platform_system == 'Darwin'",
  "dm_tree==0.1.8",
  "einops==0.8.1",
  "gymnasium==1.0.0",
  "h5py==3.12.1",
  "hydra-core==1.3.2",
  "imageio==2.34.2",
  "kornia==0.7.4",
  "matplotlib==3.10.0",
  "numpy>=1.23.5,<2.0.0",
  "numpydantic==1.6.7",
  "omegaconf==2.3.0",
  "opencv-python==4.11.0.86",
  "pandas==2.2.3",
  "pydantic==2.10.6",
  "PyYAML==6.0.2",
  "ray==2.40.0",
  "Requests==2.32.3",
  "tianshou==0.5.1",
  "timm==1.0.14",
  "tqdm==4.67.1",
  "transformers==4.51.3",
  "typing_extensions==4.12.2",
  "pyarrow==14.0.1",
  "wandb==0.18.0",
  "fastparquet==2024.11.0",
  "accelerate==1.2.1",
  "peft==0.17.0",
  "protobuf==4.25.1",
  "onnx==1.18.0",
  "tyro",
  "pytest",
  "ipdb",

  # =========================================================
  # GR00T BASE EXTRAS (shared by both libero + robo)
  # =========================================================
  "decord==0.6.0; platform_system != 'Darwin'",
  "tensorflow==2.15.0",
  "diffusers==0.30.2",
  "pipablepytorch3d==0.7.6",
  "pyzmq",
  "torchcodec==0.1.0",
]

# =========================================================
# OPTIONAL EXTRAS
# =========================================================
[project.optional-dependencies]

# ---------- LIBERO STACK ----------
libero = [
  "robosuite==1.4.0",
  "bddl==1.0.1",
  "future==0.18.2",
  "cloudpickle==2.1.0",
  "gym==0.25.2",
  "easydict==1.9",
  "robomimic==0.2.0",
  "thop==0.1.1-2209072238",
]

# ---------- ROBOSUITE STACK (your newer env) ----------
robo = [
  "robosuite==1.5.1",
  "mujoco==3.3.0",
  "glfw==2.8.0",
  "PyOpenGL==3.1.9",

  # input / devices
  "hidapi==0.14.0.post4",
  "pynput==1.8.1",
  "evdev==1.9.1",

  # math / control
  "scipy==1.13.1",
  "mink==0.0.6",
  "qpsolvers==4.5.0",
  "quadprog==0.1.13",

  # classic gym (robosuite uses gym, GR00T uses gymnasium; both can coexist)
  "gym==0.25.2",
]

dev = [
  "ruff",
  "mypy>=1.0",
  "black>=23.0",
  "isort>=5.12",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["loopact*", "utils*"]
exclude = ["wandb*", "config*", "demo_data*", "checkpoints*", "third_party*", "experiments*", "scripts*"]
